name: Build Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
  THEOS: ${{ github.workspace }}/theos-roothide

jobs:
  build:
    name: Build (${{ matrix.build_variant }})
    runs-on: macos-14
    outputs:
      package_version: ${{ steps.bump.outputs.package_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
#          - build_variant: rootful
#            package_scheme: ""
          - build_variant: rootless
            package_scheme: rootless
#          - build_variant: roothide
#            package_scheme: roothide

    steps:
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Environment
      run: |
        echo "$THEOS/bin" >> "$GITHUB_PATH"
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        echo "THEOS_IGNORE_PARALLEL_BUILDING_NOTICE=yes" >> $HOME/.theosrc

    - name: Bump Package Version
      id: bump
      run: |
        VERSION_PREFIX="0.0.1"
        VERSION="${VERSION_PREFIX}-${{ github.run_number }}"
        echo "Using version: $VERSION"
        sed -i '' "s/^Version: .*/Version: ${VERSION}/" control
        echo "package_version=${VERSION}" >> $GITHUB_OUTPUT

    - name: Checkout Theos (RootHide)
      uses: actions/checkout@v4
      with:
        repository: roothide/theos
        path: theos-roothide
        submodules: recursive

    - name: Install iOS SDK
      run: |
        cd "$THEOS"
        if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
          ./bin/install-sdk iPhoneOS16.5
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Theos dependencies
      run: |
        brew install ldid xz
        echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

    - name: Build Package
      run: |
        export THEOS="$GITHUB_WORKSPACE/theos-roothide"
        export CPATH="$GITHUB_WORKSPACE/Sources"
        export OBJC_INCLUDE_PATH="$GITHUB_WORKSPACE/Sources"
        export C_INCLUDE_PATH="$GITHUB_WORKSPACE/Sources"
        echo "CPATH=$CPATH"
        SCHEME="${{ matrix.package_scheme }}"
        if [ -n "$SCHEME" ]; then
          export THEOS_PACKAGE_SCHEME="$SCHEME"
        fi
        make package
        echo "=== .deb files ==="
        find . -name "*.deb" -type f 2>/dev/null

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: packages-${{ matrix.build_variant }}
        path: |
          ./packages/*.deb
        if-no-files-found: error

    - name: Create Release
      if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ github.token }}
        tag_name: v${{ steps.bump.outputs.package_version }}
        name: TendiesX v${{ steps.bump.outputs.package_version }}
        files: |
          ./packages/*.deb
